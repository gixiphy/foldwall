name: Foldwall
options:
  bundleIdPrefix: app.foldwall
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    # v1 只 arm64：不要 $(ARCHS_STANDARD)，不做 universal
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FoldwallCore:
    type: framework
    platform: macOS
    sources: [FoldwallCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.foldwall.core
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  Foldwall:
    type: application
    platform: macOS
    sources: [Foldwall]
    dependencies:
      - target: FoldwallCore
        embed: true
      - target: FoldwallExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.foldwall
        PRODUCT_NAME: Foldwall
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 選單列 app：不進 Dock、不開主視窗
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT. Video pipeline forked from Phosphene (MIT)."
        # v1 不沙盒；Hardened Runtime 開、Library Validation 由 entitlements 關（私有 framework dlopen）
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Foldwall/Foldwall.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  FoldwallExtension:
    # fork 自 Phosphene（MIT），只改 bundle id／顯示名／container。
    # 不動 renderer 與省電邏輯：私有 API 斷版時才能 rebase 上游修法。
    type: extensionkit-extension
    platform: macOS
    sources: [FoldwallExtension]
    info:
      path: FoldwallExtension/Info.plist
      properties:
        # 沒有這段，系統設定 → 桌布 不會出現 Foldwall
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.wallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.foldwall.extension
        PRODUCT_NAME: FoldwallExtension
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: FoldwallExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Foldwall
        SWIFT_OBJC_BRIDGING_HEADER: FoldwallExtension/WallpaperExtension-Bridging-Header.h
        # extension 本身是沙盒的（與 app 不同）：所以 app 只能用「拷貝進 container」
        # 這條契約，不能用 bookmark-link
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  FoldwallCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FoldwallCoreTests]
    dependencies:
      - target: FoldwallCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Foldwall:
    build:
      targets:
        Foldwall: all
        FoldwallCore: all
        FoldwallExtension: all
    test:
      targets: [FoldwallCoreTests]
      gatherCoverageData: false
    run:
      config: Debug
